# conda env create -f environment.yml
name: ecopro
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10.6
  - xarray
  - matplotlib
  - cartopy
  - numpy
  - requests
  - pandas
  - netcdf4
  - rioxarray
  - rasterio
  - dask
  - zarr
  - tqdm
  - h5netcdf
  - dask-jobqueue
  - fiona
  - scikit-learn
  - geopandas
  - ray-default
  - snakemake
  - cdsapi
  - skops
  - werkzeug
  - pyhdf  # MASTER L1B (HDF4); installed with pip in the existing env
  - shap  # SHAP importances for the response models; installed with pip in the existing env
  - earthengine-api  # Landsat C2 composites and structure layers (fetch_landsat_c2_ee.py, aoi_env_layers.py)
